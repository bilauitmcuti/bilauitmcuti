packages:
  - '.'

# pnpm 10+ reads overrides here (package.json#pnpm.overrides is ignored).
# Pin cookie to 0.7.2: patched for GHSA-pxg6-pf52-xh8x, still CJS so
# @cloudflare/next-on-pages esbuild (platform:neutral) can resolve it.
# cookie 1.x is ESM-only and breaks `pnpm run build:pages`.
overrides:
  cookie: 0.7.2
